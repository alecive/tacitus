<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The morning briefing on the remote model</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55554f"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="469" rx="12" fill="#ffffff" stroke="#deded8"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#1d1d1b">The morning briefing on the remote model (briefings = remote)</text>
  <text x="24" y="56" font-size="13" fill="#6b6b66">run-agent.sh runs remote_briefing.py where it used to start Claude. Code decides every fact; the model only picks refs and writes short lines.</text>

  <!-- row 1 -->
  <rect x="24" y="86" width="168" height="84" rx="10" fill="#e8eef5" stroke="#2f5d8a"/>
  <text x="108" y="110" font-size="13" font-weight="600" fill="#22476b" text-anchor="middle">1. Candidates</text>
  <text x="36" y="130" font-size="11.5" fill="#1d1d1b">gated JSON + open ledger</text>
  <text x="36" y="146" font-size="11.5" fill="#1d1d1b">rows, each with a ref</text>
  <text x="36" y="162" font-size="11.5" fill="#1d1d1b">(R1, D2, L5); no kept mail</text>

  <rect x="226" y="86" width="204" height="84" rx="10" fill="#e6f3ec" stroke="#2e7d5b"/>
  <text x="328" y="110" font-size="13" font-weight="600" fill="#1f5c42" text-anchor="middle">2. One remote call</text>
  <text x="238" y="130" font-size="11.5" fill="#1d1d1b">strict schema; picks refs for</text>
  <text x="238" y="146" font-size="11.5" fill="#1d1d1b">today, flexes, drafts, needs-you,</text>
  <text x="238" y="162" font-size="11.5" fill="#1d1d1b">hand-offs; unknown refs dropped</text>

  <rect x="458" y="86" width="196" height="84" rx="10" fill="#e8eef5" stroke="#2f5d8a"/>
  <text x="556" y="110" font-size="13" font-weight="600" fill="#22476b" text-anchor="middle">3. Rails (code)</text>
  <text x="470" y="130" font-size="11.5" fill="#1d1d1b">dean, program officer, money,</text>
  <text x="470" y="146" font-size="11.5" fill="#1d1d1b">decline, cc only, first mail</text>
  <text x="470" y="162" font-size="11.5" fill="#1d1d1b">outside CU: a decision, no draft</text>

  <line x1="192" y1="128" x2="220" y2="128" stroke="#55554f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="430" y1="128" x2="452" y2="128" stroke="#55554f" stroke-width="2" marker-end="url(#a)"/>

  <!-- three branches -->
  <rect x="680" y="76" width="296" height="62" rx="10" fill="#fbeee7" stroke="#b4572e"/>
  <text x="692" y="98" font-size="13" font-weight="600" fill="#8a3f1f">Drafts</text>
  <text x="692" y="116" font-size="11.5" fill="#1d1d1b">email_writer, then create-reply under the run id:</text>
  <text x="692" y="131" font-size="11.5" fill="#1d1d1b">Send cards as before; ledger last_action noted</text>

  <rect x="680" y="150" width="296" height="48" rx="10" fill="#f4f4f1" stroke="#9a9a93"/>
  <text x="692" y="170" font-size="13" font-weight="600" fill="#3d3d39">Needs you</text>
  <text x="692" y="188" font-size="11.5" fill="#1d1d1b">the decision in one line; rail hits land here</text>

  <rect x="680" y="210" width="296" height="78" rx="10" fill="#fbeee7" stroke="#b4572e" stroke-dasharray="6 4"/>
  <text x="692" y="232" font-size="13" font-weight="600" fill="#8a3f1f">Hand-offs to Claude</text>
  <text x="692" y="250" font-size="11.5" fill="#1d1d1b">queued; the bot opens one #ea topic per briefing;</text>
  <text x="692" y="266" font-size="11.5" fill="#1d1d1b">a Claude session reads that one thread only;</text>
  <text x="692" y="282" font-size="11.5" fill="#1d1d1b">once per thread a week</text>

  <path d="M654,110 C668,110 668,107 674,107" fill="none" stroke="#55554f" stroke-width="2" marker-end="url(#a)"/>
  <path d="M654,130 C668,130 668,174 674,174" fill="none" stroke="#55554f" stroke-width="2" marker-end="url(#a)"/>
  <path d="M654,150 C668,150 668,249 674,249" fill="none" stroke="#55554f" stroke-width="2" marker-end="url(#a)"/>

  <!-- row 2 -->
  <rect x="24" y="330" width="210" height="96" rx="10" fill="#e8eef5" stroke="#2f5d8a"/>
  <text x="129" y="354" font-size="13" font-weight="600" fill="#22476b" text-anchor="middle">4. Render (code)</text>
  <text x="36" y="374" font-size="11.5" fill="#1d1d1b">the skill's shape: due soon, get</text>
  <text x="36" y="390" font-size="11.5" fill="#1d1d1b">done today, flexes, calendar,</text>
  <text x="36" y="406" font-size="11.5" fill="#1d1d1b">drafts, needs you, sent to Claude</text>

  <rect x="270" y="330" width="230" height="96" rx="10" fill="#e6f3ec" stroke="#2e7d5b"/>
  <text x="385" y="354" font-size="13" font-weight="600" fill="#1f5c42" text-anchor="middle">5. Pre-send audit</text>
  <text x="282" y="374" font-size="11.5" fill="#1d1d1b">open_claims_audit finds evidence</text>
  <text x="282" y="390" font-size="11.5" fill="#1d1d1b">in code; the remote model gives</text>
  <text x="282" y="406" font-size="11.5" fill="#1d1d1b">verdicts; closed rows leave; re-render</text>

  <rect x="536" y="330" width="200" height="96" rx="10" fill="#f4f4f1" stroke="#9a9a93"/>
  <text x="636" y="354" font-size="13" font-weight="600" fill="#3d3d39" text-anchor="middle">6. Posted to #ea</text>
  <text x="548" y="374" font-size="11.5" fill="#1d1d1b">by run-agent.sh, as a Claude</text>
  <text x="548" y="390" font-size="11.5" fill="#1d1d1b">lane's text; the sentinel's</text>
  <text x="548" y="406" font-size="11.5" fill="#1d1d1b">post marker as before</text>

  <rect x="772" y="330" width="204" height="96" rx="10" fill="#fdecea" stroke="#b3261e"/>
  <text x="874" y="354" font-size="13" font-weight="600" fill="#8c1d18" text-anchor="middle">Model down</text>
  <text x="784" y="374" font-size="11.5" fill="#1d1d1b">code posts the ranked queue</text>
  <text x="784" y="390" font-size="11.5" fill="#1d1d1b">alone and says so; no drafts;</text>
  <text x="784" y="406" font-size="11.5" fill="#1d1d1b">never a Claude run</text>

  <path d="M828,288 L828,306 L129,306 L129,324" fill="none" stroke="#55554f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="234" y1="378" x2="264" y2="378" stroke="#55554f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="378" x2="530" y2="378" stroke="#55554f" stroke-width="2" marker-end="url(#a)"/>
  <text x="24" y="452" font-size="12" fill="#6b6b66">The afternoon update (15:00) takes steps 1, 2, 4, 5 and 6: what is new since the morning and what is still pending. It drafts and hands off nothing.</text>
</svg>
