<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 672" width="1000" height="672" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One email body for a Claude session, from brief to Send</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55554f"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d5b"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4572e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="671" rx="12" fill="#ffffff" stroke="#deded8"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#1d1d1b">One email body for a Claude session, from brief to Send (drafting = remote)</text>
  <text x="24" y="56" font-size="13" fill="#6b6b66">The session decides what the reply must say. The remote model writes it. The bot and the Send button do the rest, as before.</text>

  <!-- lifeline headers -->
  <rect x="34" y="78" width="200" height="50" rx="8" fill="#fbeee7" stroke="#b4572e"/>
  <text x="134" y="99" font-size="13" font-weight="600" fill="#8a3f1f" text-anchor="middle">Claude session</text>
  <text x="134" y="117" font-size="11" fill="#6b6b66" text-anchor="middle">a room, thread, hand-off; ea-bot</text>
  <rect x="284" y="78" width="200" height="50" rx="8" fill="#e8eef5" stroke="#2f5d8a"/>
  <text x="384" y="99" font-size="13" font-weight="600" fill="#22476b" text-anchor="middle">Mediator + email_writer</text>
  <text x="384" y="117" font-size="11" fill="#6b6b66" text-anchor="middle">runs as the owner, holds the key</text>
  <rect x="534" y="78" width="200" height="50" rx="8" fill="#e6f3ec" stroke="#2e7d5b"/>
  <text x="634" y="99" font-size="13" font-weight="600" fill="#1f5c42" text-anchor="middle">Remote model</text>
  <text x="634" y="117" font-size="11" fill="#6b6b66" text-anchor="middle">qwen3.8-mm</text>
  <rect x="784" y="78" width="190" height="50" rx="8" fill="#f4f4f1" stroke="#9a9a93"/>
  <text x="879" y="99" font-size="13" font-weight="600" fill="#1d1d1b" text-anchor="middle">Bot and you</text>
  <text x="879" y="117" font-size="11" fill="#6b6b66" text-anchor="middle">Send card in the DM</text>

  <line x1="134" y1="128" x2="134" y2="614" stroke="#d6c2b8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="384" y1="128" x2="384" y2="614" stroke="#bcc9d8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="634" y1="128" x2="634" y2="614" stroke="#b9d6c7" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="879" y1="128" x2="879" y2="614" stroke="#d0d0ca" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 1 brief -->
  <circle cx="24" cy="160" r="10" fill="#1d1d1b"/><text x="24" y="164" font-size="11" fill="#fff" text-anchor="middle">1</text>
  <rect x="44" y="146" width="182" height="30" rx="6" fill="#ffffff" stroke="#b4572e"/>
  <text x="54" y="166" font-size="11.5" fill="#1d1d1b">writes the brief to ~/.ea/state/</text>

  <!-- 2 call -->
  <circle cx="24" cy="206" r="10" fill="#1d1d1b"/><text x="24" y="210" font-size="11" fill="#fff" text-anchor="middle">2</text>
  <line x1="134" y1="206" x2="378" y2="206" stroke="#55554f" stroke-width="2" marker-end="url(#a)"/>
  <text x="146" y="198" font-size="11.5" fill="#1d1d1b">email_writer.py write --to --brief-file --out</text>
  <text x="146" y="222" font-size="11" fill="#6b6b66">forwards to the mediator queue</text>

  <!-- 3 stage + context -->
  <circle cx="274" cy="256" r="10" fill="#1d1d1b"/><text x="274" y="260" font-size="11" fill="#fff" text-anchor="middle">3</text>
  <rect x="294" y="236" width="230" height="78" rx="6" fill="#ffffff" stroke="#2f5d8a"/>
  <text x="304" y="254" font-size="11.5" fill="#1d1d1b">stages the brief; runs on its own thread</text>
  <text x="304" y="271" font-size="11.5" fill="#1d1d1b">builds the context: agent instructions,</text>
  <text x="304" y="288" font-size="11.5" fill="#1d1d1b">style profile, voice guide, brief, thread,</text>
  <text x="304" y="305" font-size="11.5" fill="#1d1d1b">current draft (for a revision)</text>

  <!-- 4 request -->
  <circle cx="274" cy="362" r="10" fill="#1d1d1b"/><text x="274" y="366" font-size="11" fill="#fff" text-anchor="middle">4</text>
  <line x1="384" y1="350" x2="628" y2="350" stroke="#2e7d5b" stroke-width="2" marker-end="url(#ag)"/>
  <text x="396" y="342" font-size="11.5" fill="#1f5c42">request; at most 90 s</text>
  <line x1="628" y1="374" x2="390" y2="374" stroke="#2e7d5b" stroke-width="2" marker-end="url(#ag)"/>
  <text x="640" y="378" font-size="11.5" fill="#1f5c42">the body (about 2-4 s warm)</text>

  <!-- 5 finish -->
  <circle cx="274" cy="410" r="10" fill="#1d1d1b"/><text x="274" y="414" font-size="11" fill="#fff" text-anchor="middle">5</text>
  <rect x="294" y="392" width="230" height="44" rx="6" fill="#ffffff" stroke="#2f5d8a"/>
  <text x="304" y="410" font-size="11.5" fill="#1d1d1b">notes split off, dashes fixed; empty</text>
  <text x="304" y="427" font-size="11.5" fill="#1d1d1b">or NEED: means exit 4 (fallback)</text>

  <!-- 6 back -->
  <circle cx="24" cy="462" r="10" fill="#1d1d1b"/><text x="24" y="466" font-size="11" fill="#fff" text-anchor="middle">6</text>
  <line x1="384" y1="462" x2="140" y2="462" stroke="#55554f" stroke-width="2" marker-end="url(#a)"/>
  <text x="146" y="454" font-size="11.5" fill="#1d1d1b">body in reply-body.txt, JSON on stdout</text>
  <text x="146" y="478" font-size="11" fill="#6b6b66">whole run capped at 105 s</text>

  <!-- 7 draft -->
  <circle cx="24" cy="512" r="10" fill="#1d1d1b"/><text x="24" y="516" font-size="11" fill="#fff" text-anchor="middle">7</text>
  <rect x="44" y="496" width="214" height="46" rx="6" fill="#ffffff" stroke="#b4572e"/>
  <text x="54" y="515" font-size="11.5" fill="#1d1d1b">exit 0: create-reply --body-file</text>
  <text x="54" y="532" font-size="11.5" fill="#b4572e">exit 3 or 4: email-author subagent</text>

  <!-- 8 card -->
  <circle cx="24" cy="574" r="10" fill="#1d1d1b"/><text x="24" y="578" font-size="11" fill="#fff" text-anchor="middle">8</text>
  <line x1="134" y1="574" x2="873" y2="574" stroke="#55554f" stroke-width="2" marker-end="url(#a)"/>
  <text x="146" y="566" font-size="11.5" fill="#1d1d1b">draft exists; the bot matches it to the writer's record (note_writer_draft) and posts the Send card</text>

  <!-- 9 send -->
  <circle cx="774" cy="604" r="10" fill="#1d1d1b"/><text x="774" y="608" font-size="11" fill="#fff" text-anchor="middle">9</text>
  <rect x="790" y="590" width="186" height="30" rx="6" fill="#ffffff" stroke="#9a9a93"/>
  <text x="800" y="609" font-size="11.5" fill="#1d1d1b">Send: edit ratio recorded</text>
  <text x="24" y="652" font-size="12" fill="#6b6b66">The morning briefing has no Claude session: code builds the brief from the remote model's pick and calls the writer in-process (Figure 5).</text>
</svg>
