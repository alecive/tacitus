# Self-hosted Zulip for the EA chat front end (dev realm on this machine).
#
# Adapted from zulip/docker-zulip compose.yaml (main, image 12.3-0) with the
# example override folded in. Differences from upstream:
#   - one file, no compose.override.yaml;
#   - only HTTP is published, and only on 127.0.0.1:8080 (no 25, no 443);
#   - no build section, no email_password secret;
#   - outgoing mail goes to the container log (console backend), so account
#     and bot creation work without a mail server.
#
#   - two-factor sign-in (TOTP) is on for web logins.
#
# Secrets come from the owner-private ~/.ea-private/zulip.env (see
# .env.example and env.sh; deploy/zulip/.env, gitignored, is the fallback).
# Bring up: deploy/zulip/compose.sh up -d   (it passes --env-file)
# Details: deploy/zulip/README.md
name: ea-zulip

secrets:
  zulip__postgres_password:
    environment: "ZULIP__POSTGRES_PASSWORD"
  zulip__memcached_password:
    environment: "ZULIP__MEMCACHED_PASSWORD"
  zulip__rabbitmq_password:
    environment: "ZULIP__RABBITMQ_PASSWORD"
  zulip__redis_password:
    environment: "ZULIP__REDIS_PASSWORD"
  zulip__secret_key:
    environment: "ZULIP__SECRET_KEY"

services:
  database:
    image: "zulip/zulip-postgresql:14"
    restart: unless-stopped
    secrets:
      - zulip__postgres_password
    environment:
      POSTGRES_DB: "zulip"
      POSTGRES_USER: "zulip"
      POSTGRES_PASSWORD_FILE: /run/secrets/zulip__postgres_password
    volumes:
      - "postgresql-14:/var/lib/postgresql/data:rw"
    attach: false

  memcached:
    image: "memcached:alpine"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:$$(cat $$MEMCACHED_PASSWORD_FILE)" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:$$(cat $$MEMCACHED_PASSWORD_FILE)" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    secrets:
      - zulip__memcached_password
    environment:
      SASL_CONF_PATH: "/home/memcache/memcached.conf"
      MEMCACHED_SASL_PWDB: "/home/memcache/memcached-sasl-db"
      MEMCACHED_PASSWORD_FILE: /run/secrets/zulip__memcached_password
    attach: false

  rabbitmq:
    image: "rabbitmq:4.2"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        export RABBITMQ_DEFAULT_PASS="$$(cat $$RABBITMQ_PASSWORD_FILE)"
        echo 'default_user = $$(RABBITMQ_DEFAULT_USER)' >> /etc/rabbitmq/rabbitmq.conf
        echo 'default_pass = $$(RABBITMQ_DEFAULT_PASS)' >> /etc/rabbitmq/rabbitmq.conf
        exec docker-entrypoint.sh rabbitmq-server
    secrets:
      - zulip__rabbitmq_password
    environment:
      RABBITMQ_DEFAULT_USER: "zulip"
      RABBITMQ_PASSWORD_FILE: /run/secrets/zulip__rabbitmq_password
    volumes:
      - "rabbitmq:/var/lib/rabbitmq:rw"
    attach: false

  redis:
    image: "redis:alpine"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - '/usr/local/bin/docker-entrypoint.sh --requirepass "$$(cat $$REDIS_PASSWORD_FILE)"'
    secrets:
      - zulip__redis_password
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/zulip__redis_password
    volumes:
      - "redis:/data:rw"
    attach: false

  zulip:
    image: "ghcr.io/zulip/zulip-server:12.3-0"
    restart: unless-stopped
    ports:
      # Loopback only. The EA and the browser on this machine reach it here;
      # nothing else can.
      - "127.0.0.1:8080:80"
    secrets:
      - zulip__postgres_password
      - zulip__memcached_password
      - zulip__rabbitmq_password
      - zulip__redis_password
      - zulip__secret_key
    environment:
      SETTING_REMOTE_POSTGRES_HOST: "database"
      SETTING_MEMCACHED_LOCATION: "memcached:11211"
      SETTING_RABBITMQ_HOST: "rabbitmq"
      SETTING_REDIS_HOST: "redis"

      # Zulip refuses a host without a dot (zulip.E002), so bare localhost
      # does not work. Every name under .localhost resolves to loopback
      # (systemd-resolved and browsers), so this needs no /etc/hosts entry.
      # The realm is served only under this name: clients use
      # http://zulip.localhost:8080, not http://127.0.0.1:8080.
      SETTING_EXTERNAL_HOST: "${ZULIP_EXTERNAL_HOST:?set ZULIP_EXTERNAL_HOST in the Zulip env file (deploy/zulip/env.sh)}"
      SETTING_ZULIP_ADMINISTRATOR: "${ZULIP_ADMIN_EMAIL:?set ZULIP_ADMIN_EMAIL in the Zulip env file (deploy/zulip/env.sh)}"

      # Plain HTTP on port 80 inside the container. The 12.x image replaced
      # the legacy DISABLE_HTTPS=True with CERTIFICATES; the empty value is
      # the HTTP-only mode, and the image refuses to start if DISABLE_HTTPS
      # is set at all.
      CERTIFICATES: ""
      # Zulip refuses EXTERNAL_URI_SCHEME=http:// in production (zulip.E004),
      # so the links it builds (realm_url, invitations) say https:// while
      # this dev stack answers on http:// only. Clients use
      # http://zulip.localhost:8080. Browsers treat *.localhost as a secure
      # context, so Zulip's Secure session cookies still work over HTTP here.
      # Trust X-Forwarded-* only from the Docker gateway (the published port).
      TRUST_GATEWAY_IP: "True"

      # Two-factor sign-in: a web login asks for a TOTP code once the account
      # has enrolled (/account/two_factor/). The bot authenticates with its
      # API key and is not affected. Zulip marks this feature as beta.
      SETTING_TWO_FACTOR_AUTHENTICATION_ENABLED: "True"

      # No mail server: outgoing mail is written to the container log.
      # Invitations and confirmation links can be read with
      # `docker compose logs zulip | grep -A40 Subject:`.
      SETTING_EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"

      # The host has 30 GB; the lighter threaded queue mode is plenty for
      # one owner and one bot.
      CONFIG_application_server__queue_workers_multiprocess: "False"
      # One owner and one bot: two web workers instead of the CPU-count
      # default, which put eighteen 250 MB uwsgi processes on the box.
      CONFIG_application_server__uwsgi_processes: "2"
      # Mobile push goes through Zulip's push service (free for up to ten
      # users); payloads carry no message content, the phone fetches the
      # text from this server. No usage statistics are submitted.
      ZULIP_CUSTOM_SETTINGS: |
        ZULIP_SERVICE_PUSH_NOTIFICATIONS = True
        ZULIP_SERVICE_SUBMIT_USAGE_STATISTICS = False
        PUSH_NOTIFICATION_REDACT_CONTENT = True
    volumes:
      - "zulip:/data:rw"
    ulimits:
      nofile:
        soft: 1000000
        hard: 1048576
    depends_on:
      - database
      - memcached
      - rabbitmq
      - redis

volumes:
  zulip:
  postgresql-14:
  rabbitmq:
  redis:
